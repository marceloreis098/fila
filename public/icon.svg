<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#vaultGrad)" />
  
  <!-- Outer Geometric Relic Border -->
  <polygon points="256,76 396,160 396,352 256,436 116,352 116,160" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round" />
  
  <!-- Inner Facets -->
  <polygon points="256,116 360,180 360,332 256,396 152,332 152,180" fill="#0F172A" stroke="#334155" stroke-width="4" opacity="0.6" />
  
  <!-- Vault Diamond Core -->
  <polygon points="256,140 336,236 256,360 176,236" fill="url(#goldGrad)" filter="url(#glow)" />
  <polygon points="256,140 256,360 336,236" fill="#FBBF24" opacity="0.8" />
  <polygon points="256,140 256,360 176,236" fill="#D97706" opacity="0.9" />
  
  <!-- Sparkle Accent -->
  <circle cx="340" cy="160" r="10" fill="#FFFFFF" />
  <path d="M 340,144 L 340,176 M 324,160 L 356,160" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
</svg>
